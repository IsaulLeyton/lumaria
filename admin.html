<body>

  <header class="barra">
    <div class="contenedor">
      <a class="logo" href="./" aria-label="Lumaria, inicio">
        <span data-logo></span>
        <span class="logo-txt">Lumaria<span>.</span></span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="./#mapa">Mapa</a>
        <a href="comunidad">Comunidad</a>
      </nav>
      <div class="cuenta" id="cuenta"></div>
    </div>
  </header>

  <main class="contenedor admin">
    <div class="seccion-titulo" style="margin:40px 0 24px">
      <div>
        <span class="kicker">Solo para la administración</span>
        <h2>Panel de moderación</h2>
      </div>
    </div>

    <div id="admin-bloqueo" class="vacio" hidden></div>

    <div id="admin-contenido" hidden>
      <div class="pestanas" role="tablist">
        <button type="button" role="tab" data-tab="pendientes">Fotos por revisar <span class="contador" id="n-pendientes"></span></button>
        <button type="button" role="tab" data-tab="especies">Especies propuestas <span class="contador" id="n-especies"></span></button>
        <button type="button" role="tab" data-tab="reportes">Reportes <span class="contador" id="n-reportes"></span></button>
        <button type="button" role="tab" data-tab="bloqueados">Usuarios bloqueados</button>
      </div>
      <div id="tab-pendientes"></div>
      <div id="tab-especies" hidden></div>
      <div id="tab-reportes" hidden></div>
      <div id="tab-bloqueados" hidden></div>
    </div>
  </main>

  <dialog class="modal" id="dlg-ampliar" aria-label="Foto ampliada">
    <button class="modal-cerrar" type="button" aria-label="Cerrar" data-cerrar-dialogo>×</button>
    <div class="modal-foto"><img alt=""></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"
    integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/comunidad-base.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
